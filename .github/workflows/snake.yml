name: generate snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Dots follow the activity card's ramp and the snake is the page's rose,
      # so the animation sits in the same palette as the drawn cards. Values
      # are URL-encoded ('#' -> %23); snk parses the query with URLSearchParams.
      #   light: cream -> honey -> amber -> caramel -> ink
      #   dark:  warm charcoal -> cocoa -> caramel -> amber -> honey
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Crosery
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23dd8f8c&color_dot_border=%234a342722&color_dots=%23f1e4d8,%23f0cf8f,%23dba85f,%23c4864a,%234a3427
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23dd8f8c&color_dot_border=%23f7e8d822&color_dots=%2323201f,%236b4a33,%23a9743f,%23dba85f,%23f0cf8f

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
