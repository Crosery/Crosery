name: refresh profile cards

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gen-profile.py'
      - 'scripts/pix.py'
      - 'scripts/wordmark.py'
      - 'scripts/sprite_data.py'
      - 'scripts/font_10.py'
      - '.github/workflows/refresh-cards.yml'

# One refresh at a time: a manual dispatch landing next to the on-push run
# otherwise races it to `git push` and one of the two is rejected.
concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: the generator and the drawing toolkit are pure stdlib.
      # The pixel fonts, the portrait sprite and the wordmark are committed
      # modules, so nothing is fetched or rasterised at build time.
      - name: regenerate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen-profile.py

      - name: commit if changed
        run: |
          set -euo pipefail
          FILES="assets/hero.svg assets/pinned.svg assets/activity.svg assets/signature.svg"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -n "$(git status --porcelain $FILES)" ]]; then
            git add $FILES
            git commit -m "chore: refresh profile cards"
            git pull --rebase origin main
            git push
          else
            echo "no changes"
          fi
