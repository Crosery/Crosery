<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-label="Now reading">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
      .h     { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 0.28em; }
      .body  { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .meta  { font-family: 'Courier New', monospace; font-weight: 400; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1280" height="280" fill="#fafafa"/>
  <line x1="80" y1="30" x2="1200" y2="30" stroke="#0a0a0a" stroke-width="0.8"/>

  <text x="80" y="22" class="meta" font-size="10" fill="#0a0a0a">SECTION 01 / NOW</text>
  <text x="1200" y="22" text-anchor="end" class="meta" font-size="10" fill="#9a9a9a">UPDATED MAY 2026</text>

  <text x="80" y="90" class="title" font-size="44" fill="#0a0a0a">
    现在在做<tspan fill="#ff2e2e">.</tspan>
  </text>

  <g transform="translate(80,120)">
    <g>
      <text class="h" font-size="11" fill="#ff2e2e">A / 强化学习</text>
      <text class="title" font-size="20" fill="#0a0a0a" y="28">KAIWU 1v1 PPO</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="52">腾讯开悟王者荣耀 2 年参赛</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="70">v3.1 双英雄不对称修复</text>
      <text class="meta" font-size="10" fill="#9a9a9a" y="92">step 148,908 · reward shaping</text>
    </g>

    <g transform="translate(380,0)">
      <text class="h" font-size="11" fill="#ff2e2e">B / 工具链</text>
      <text class="title" font-size="20" fill="#0a0a0a" y="28">RUNAI</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="52">Rust 写的 AI CLI 资源管理器</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="70">跨 Claude/Codex/Gemini 管 skills/MCP</text>
      <text class="meta" font-size="10" fill="#9a9a9a" y="92">cargo install runai-cli · v0.11.0-beta</text>
    </g>

    <g transform="translate(760,0)">
      <text class="h" font-size="11" fill="#ff2e2e">C / 创意系统</text>
      <text class="title" font-size="20" fill="#0a0a0a" y="28">PPT-ANYTHING</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="52">AI story-deck 生成器</text>
      <text class="body" font-size="13" fill="#3a3a3a" y="70">给 topic 出连贯插画 PPT</text>
      <text class="meta" font-size="10" fill="#9a9a9a" y="92">water-color / chibi / 印刷风</text>
    </g>
  </g>

  <g transform="translate(80,250)">
    <rect width="0" height="2" fill="#0a0a0a">
      <animate attributeName="width" from="0" to="1120" dur="2.4s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
    <circle cx="0" cy="1" r="3" fill="#ff2e2e">
      <animateMotion dur="2.4s" begin="0.5s" fill="freeze" path="M0,0 L1120,0"/>
      <animate attributeName="r" values="3;6;3" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
