<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Section 03 / Stack">
  <defs>
    <style>
      .display { font-family: 'Helvetica Neue', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -0.04em; }
      .thin    { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 200; letter-spacing: -0.01em; }
      .meta    { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1280" height="380" fill="#0d1117"/>

  <line x1="80" y1="30" x2="1200" y2="30" stroke="#30363d" stroke-width="0.6"/>
  <text x="80" y="22" class="meta" font-size="10" fill="#7d8590">SECTION 03 / STACK</text>
  <text x="1200" y="22" text-anchor="end" class="meta" font-size="10" fill="#7d8590">DAILY DRIVERS — RANKED BY HOURS</text>

  <g transform="translate(80,90)">
    <text class="meta" font-size="10" fill="#ff7b72" y="0">CORE LANGUAGES</text>
    <text class="display" font-size="76" fill="#f0f6fc" y="60">RUST  <tspan fill="#7d8590">·</tspan>  PYTHON  <tspan fill="#7d8590">·</tspan>  TS</text>
  </g>

  <g transform="translate(80,180)">
    <text class="meta" font-size="10" fill="#58a6ff" y="0">AI / RL</text>
    <text class="thin" font-size="40" fill="#f0f6fc" y="42">pytorch <tspan fill="#58a6ff">·</tspan> reverb <tspan fill="#58a6ff">·</tspan> ppo <tspan fill="#58a6ff">·</tspan> mcp <tspan fill="#58a6ff">·</tspan> claude sdk</text>
  </g>

  <g transform="translate(80,250)">
    <text class="meta" font-size="10" fill="#7ee787" y="0">RUNTIME</text>
    <text class="thin" font-size="26" fill="#c9d1d9" y="28">linux <tspan fill="#7ee787">·</tspan> nixos <tspan fill="#7ee787">·</tspan> niri-wayland <tspan fill="#7ee787">·</tspan> neovim <tspan fill="#7ee787">·</tspan> podman</text>
  </g>

  <g transform="translate(80,305)">
    <text class="meta" font-size="10" fill="#d2a8ff" y="0">WEB / VISUAL</text>
    <text class="thin" font-size="22" fill="#c9d1d9" y="26">vite <tspan fill="#d2a8ff">·</tspan> next.js <tspan fill="#d2a8ff">·</tspan> tailwind <tspan fill="#d2a8ff">·</tspan> svg + smil <tspan fill="#d2a8ff">·</tspan> handwritten html</text>
  </g>

  <g transform="translate(1200,90)" text-anchor="end">
    <text class="meta" font-size="9" fill="#7d8590">— PRINCIPLES —</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="24">source &gt; docs</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="44">measure, don&#39;t guess</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="64">ship narrow, ship done</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="84">no emoji, ever</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="104">prefer rust over duct tape</text>
    <text class="thin" font-size="14" fill="#f0f6fc" y="124">prefer ascii over framework</text>
  </g>

  <!-- bottom scan line -->
  <g transform="translate(80,360)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#30363d" stroke-width="0.5"/>
    <rect x="0" y="-1" width="0" height="2" fill="#58a6ff">
      <animate attributeName="x" values="0;1120" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="80;0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
