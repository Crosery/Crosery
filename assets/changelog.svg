<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Section 04 / Changelog">
  <defs>
    <style>
      .title { font-family: 'Helvetica Neue', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
      .h     { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 0.24em; }
      .body  { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .meta  { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.06em; }
      .tag   { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#0d1117"/>

  <line x1="80" y1="30" x2="1200" y2="30" stroke="#30363d" stroke-width="0.6"/>
  <text x="80" y="22" class="meta" font-size="10" fill="#7d8590">SECTION 04 / CHANGELOG</text>
  <text x="1200" y="22" text-anchor="end" class="meta" font-size="10" fill="#7d8590">RECENT DROPS — LAST 30 DAYS</text>

  <text x="80" y="92" class="title" font-size="40" fill="#f0f6fc">LATEST<tspan fill="#ff7b72">.</tspan></text>

  <!-- timeline column -->
  <g transform="translate(80,140)">
    <line x1="6" y1="0" x2="6" y2="150" stroke="#30363d" stroke-width="1"/>

    <g transform="translate(0,4)">
      <circle cx="6" cy="0" r="6" fill="#ff7b72"/>
      <text x="30" y="-2" class="tag" font-size="10" fill="#ff7b72">2026-05-18</text>
      <text x="160" y="-2" class="meta" font-size="10" fill="#7d8590">CROSERY/CROSERY</text>
      <text x="30" y="18" class="body" font-size="13" fill="#c9d1d9">redesigned profile readme — night edition with self-hosted svg animations</text>
    </g>

    <g transform="translate(0,52)">
      <circle cx="6" cy="0" r="5" fill="#58a6ff"/>
      <text x="30" y="-2" class="tag" font-size="10" fill="#58a6ff">2026-05-18</text>
      <text x="160" y="-2" class="meta" font-size="10" fill="#7d8590">CROSERY/RUNAI</text>
      <text x="30" y="18" class="body" font-size="13" fill="#c9d1d9">v0.11.0-beta.3 — recommend feedback + market install + groups</text>
    </g>

    <g transform="translate(0,100)">
      <circle cx="6" cy="0" r="5" fill="#7ee787"/>
      <text x="30" y="-2" class="tag" font-size="10" fill="#7ee787">2026-05-06</text>
      <text x="160" y="-2" class="meta" font-size="10" fill="#7d8590">CROSERY/CROCO</text>
      <text x="30" y="18" class="body" font-size="13" fill="#c9d1d9">small playful repo — JavaScript-driven experiment ship</text>
    </g>

    <g transform="translate(0,148)">
      <circle cx="6" cy="0" r="5" fill="#d2a8ff"/>
      <text x="30" y="-2" class="tag" font-size="10" fill="#d2a8ff">2026-05-01</text>
      <text x="160" y="-2" class="meta" font-size="10" fill="#7d8590">CROSERY/PPT-ANYTHING</text>
      <text x="30" y="18" class="body" font-size="13" fill="#c9d1d9">ai story-deck generator — initial release with watercolor / chibi presets</text>
    </g>
  </g>

  <!-- right column: weekly heartbeat -->
  <g transform="translate(780,90)">
    <text class="meta" font-size="10" fill="#7d8590" y="0">7-DAY COMMIT HEARTBEAT</text>

    <!-- 7 bars representing days -->
    <g transform="translate(0,30)">
      <g><rect x="0"   y="80" width="36" height="0" fill="#58a6ff"><animate attributeName="height" from="0" to="35" dur="0.6s" begin="0.0s" fill="freeze"/><animate attributeName="y" from="80" to="45" dur="0.6s" begin="0.0s" fill="freeze"/></rect></g>
      <g><rect x="50"  y="80" width="36" height="0" fill="#58a6ff"><animate attributeName="height" from="0" to="60" dur="0.6s" begin="0.1s" fill="freeze"/><animate attributeName="y" from="80" to="20" dur="0.6s" begin="0.1s" fill="freeze"/></rect></g>
      <g><rect x="100" y="80" width="36" height="0" fill="#58a6ff"><animate attributeName="height" from="0" to="48" dur="0.6s" begin="0.2s" fill="freeze"/><animate attributeName="y" from="80" to="32" dur="0.6s" begin="0.2s" fill="freeze"/></rect></g>
      <g><rect x="150" y="80" width="36" height="0" fill="#58a6ff"><animate attributeName="height" from="0" to="72" dur="0.6s" begin="0.3s" fill="freeze"/><animate attributeName="y" from="80" to="8"  dur="0.6s" begin="0.3s" fill="freeze"/></rect></g>
      <g><rect x="200" y="80" width="36" height="0" fill="#ff7b72"><animate attributeName="height" from="0" to="80" dur="0.6s" begin="0.4s" fill="freeze"/><animate attributeName="y" from="80" to="0"  dur="0.6s" begin="0.4s" fill="freeze"/></rect></g>
      <g><rect x="250" y="80" width="36" height="0" fill="#58a6ff"><animate attributeName="height" from="0" to="58" dur="0.6s" begin="0.5s" fill="freeze"/><animate attributeName="y" from="80" to="22" dur="0.6s" begin="0.5s" fill="freeze"/></rect></g>
      <g><rect x="300" y="80" width="36" height="0" fill="#7ee787"><animate attributeName="height" from="0" to="44" dur="0.6s" begin="0.6s" fill="freeze"/><animate attributeName="y" from="80" to="36" dur="0.6s" begin="0.6s" fill="freeze"/></rect></g>
    </g>

    <g transform="translate(0,130)" class="meta" font-size="9" fill="#7d8590">
      <text x="0">MON</text>
      <text x="50">TUE</text>
      <text x="100">WED</text>
      <text x="150">THU</text>
      <text x="200">FRI</text>
      <text x="250">SAT</text>
      <text x="300">SUN</text>
    </g>

    <g transform="translate(0,164)" class="meta" font-size="10" fill="#7d8590">
      <text x="0">PEAK Friday — pushing fixes before weekend</text>
      <text x="0" y="16">AVG 56 commits / week · longest streak 11 days</text>
    </g>
  </g>

  <!-- bottom border -->
  <g transform="translate(80,298)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#30363d" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#ff7b72">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,0 L1120,0 L1120,0 L0,0"/>
    </circle>
  </g>
</svg>
