<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Stats">
  <defs><style>
    .title { font-family: 'Helvetica Neue', 'Arial Black', Impact, sans-serif; font-weight: 900; letter-spacing: -0.04em; }
    .h     { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 0.20em; }
    .meta  { font-family: 'Courier New', 'JetBrains Mono', monospace; font-weight: 400; letter-spacing: 0.06em; }
  </style></defs>
  <rect width="600" height="380" fill="#0d1117"/>
  <line x1="30" y1="30" x2="570" y2="30" stroke="#30363d" stroke-width="0.6"/>
  <text x="30" y="22" class="meta" font-size="10" fill="#7d8590">// STATS · @Crosery</text>
  <text x="570" y="22" text-anchor="end" class="meta" font-size="10" fill="#7d8590">LIVE · auto-refreshed</text>
  <text x="30" y="74" class="title" font-size="38" fill="#f0f6fc">NUMBERS<tspan fill="#ff7b72">.</tspan></text>
  <text x="30" y="94" class="meta" font-size="10" fill="#7d8590">pulled fresh from github graphql api</text>
  <g transform="translate(30,140)">
