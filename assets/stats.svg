    <rect x="0" y="68" width="0" height="2" fill="#7ee787">
      <animate attributeName="width" from="0" to="160" dur="1.4s" begin="0.20s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    </rect>
  </g>
  <g transform="translate(30,250)">
